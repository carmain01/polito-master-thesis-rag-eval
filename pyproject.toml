[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval"
version = "0.1.0"
description = "A modular framework for evaluating Retrieval-Augmented Generation (RAG) systems."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Carmine" },
]
dependencies = [
    # Core
    "pydantic>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "rich>=13.0",
    # LLM providers
    "openai>=1.0",
    "anthropic>=0.45",
    "google-genai>=1.0",
    "httpx>=0.27",
    # Tokenization & text
    "tiktoken>=0.5",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    # Embeddings (local)
    "sentence-transformers>=3.0",
    # Utilities
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "typer>=0.9",
]

[project.scripts]
rag-eval = "rag_eval.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]
langchain = [
    "langchain-core>=0.1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
