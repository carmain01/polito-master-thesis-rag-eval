<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparative Evaluation Report</title>
    <style>
${bootstrap_css}
        body { padding: 20px; }
        .chart-container { max-width: 700px; margin: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">Comparative RAG Evaluation Report</h1>
        <p class="text-muted text-center">Generated on: ${timestamp}</p>

        <div class="row mb-5">
            <div class="col-md-6 chart-container">
                <h4 class="text-center">Radar Comparison</h4>
                <canvas id="radarChart"></canvas>
            </div>
            <div class="col-md-6 chart-container">
                <h4 class="text-center">Bar Comparison</h4>
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <h3 class="mb-3">Summary Table</h3>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Metric</th>
                        ${config_headers}
                        <th>Delta (Best - Worst)</th>
                    </tr>
                </thead>
                <tbody>
                    ${summary_rows}
                </tbody>
            </table>
        </div>
    </div>

    <script>
${bootstrap_js}
    </script>
    <script>
${chartjs}
    </script>
    <script>
        const labels = ${chart_labels};
        const datasets = ${chart_datasets};

        const radarColors = [
            { bg: 'rgba(54, 162, 235, 0.2)', border: 'rgba(54, 162, 235, 1)' },
            { bg: 'rgba(255, 99, 132, 0.2)', border: 'rgba(255, 99, 132, 1)' },
            { bg: 'rgba(75, 192, 192, 0.2)', border: 'rgba(75, 192, 192, 1)' },
            { bg: 'rgba(255, 206, 86, 0.2)', border: 'rgba(255, 206, 86, 1)' },
            { bg: 'rgba(153, 102, 255, 0.2)', border: 'rgba(153, 102, 255, 1)' },
        ];

        const radarDatasets = datasets.map((ds, idx) => ({
            label: ds.label,
            data: ds.data,
            backgroundColor: radarColors[idx % radarColors.length].bg,
            borderColor: radarColors[idx % radarColors.length].border,
            pointBackgroundColor: radarColors[idx % radarColors.length].border,
        }));

        // Radar Chart
        new Chart(document.getElementById('radarChart').getContext('2d'), {
            type: 'radar',
            data: { labels: labels, datasets: radarDatasets },
            options: { scales: { r: { min: 0, max: 1 } } }
        });

        // Grouped Bar Chart
        const barDatasets = datasets.map((ds, idx) => ({
            label: ds.label,
            data: ds.data,
            backgroundColor: radarColors[idx % radarColors.length].border.replace('1)', '0.6)'),
            borderColor: radarColors[idx % radarColors.length].border,
            borderWidth: 1
        }));

        new Chart(document.getElementById('barChart').getContext('2d'), {
            type: 'bar',
            data: { labels: labels, datasets: barDatasets },
            options: { scales: { y: { beginAtZero: true, max: 1 } } }
        });
    </script>
</body>
</html>
