<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation Report</title>
    <style>
${bootstrap_css}
        body { padding: 20px; }
        .chart-container { max-width: 600px; margin: auto; }
        .accordion-toggle:hover { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="my-4 text-center">RAG Evaluation Report</h1>
        <p class="text-muted text-center">Generated on: ${timestamp}</p>
        
        <div class="row mb-5">
            <div class="col-md-6 chart-container">
                <canvas id="radarChart"></canvas>
            </div>
            <div class="col-md-6 chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </div>
        
        <div class="row mb-5">
            <div class="col-12 chart-container" style="max-width: 1000px;">
                <h4 class="text-center">Score Distributions</h4>
                <canvas id="distChart"></canvas>
            </div>
        </div>

        <h3 class="mb-3">Detailed Results</h3>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Sample Index</th>
                        <th>Average Score</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody>
                    ${table_rows}
                </tbody>
            </table>
        </div>
    </div>

    <script>
${bootstrap_js}
    </script>
    <script>
${chartjs}
    </script>
    <script>
        const labels = ${chart_labels};
        const dataValues = ${chart_data};
        const distributions = ${chart_distributions};

        // Radar Chart
        const ctxRadar = document.getElementById('radarChart').getContext('2d');
        new Chart(ctxRadar, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Mean Score',
                    data: dataValues,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    pointBackgroundColor: 'rgba(54, 162, 235, 1)',
                }]
            },
            options: {
                scales: {
                    r: { min: 0, max: 1 }
                }
            }
        });

        // Bar Chart
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Mean Score',
                    data: dataValues,
                    backgroundColor: 'rgba(75, 192, 192, 0.6)',
                    borderColor: 'rgba(75, 192, 192, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true, max: 1 }
                }
            }
        });

        // Distribution Chart
        const distDatasets = labels.map((label, idx) => {
            const colors = [
                'rgba(54, 162, 235, 0.6)',
                'rgba(255, 99, 132, 0.6)',
                'rgba(75, 192, 192, 0.6)',
                'rgba(255, 206, 86, 0.6)',
                'rgba(153, 102, 255, 0.6)'
            ];
            const color = colors[idx % colors.length];
            return {
                label: label,
                data: distributions[label],
                backgroundColor: color,
                borderColor: color.replace('0.6', '1'),
                borderWidth: 1,
                hidden: idx > 0
            };
        });

        const ctxDist = document.getElementById('distChart').getContext('2d');
        new Chart(ctxDist, {
            type: 'bar',
            data: {
                labels: ['0.0-0.1', '0.1-0.2', '0.2-0.3', '0.3-0.4', '0.4-0.5', '0.5-0.6', '0.6-0.7', '0.7-0.8', '0.8-0.9', '0.9-1.0'],
                datasets: distDatasets
            },
            options: {
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: 'Count' } },
                    x: { title: { display: true, text: 'Score Range' } }
                }
            }
        });
    </script>
</body>
</html>
