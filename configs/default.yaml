# Default evaluation configuration
# By default uses Ollama (local, free) — no API key needed.
# Make sure Ollama is running: https://ollama.com

llm:
  provider: ollama
  model: llama3.1
  temperature: 0.0
  max_tokens: 1024
  timeout: 60.0
  max_retries: 3
  reasoning_effort: high

embedding:
  provider: sentence-transformers
  model: all-MiniLM-L6-v2
  batch_size: 32

cache:
  enabled: true
  directory: .cache/rag_eval
  # ttl_seconds: null  # No expiration by default

metrics:
  - faithfulness
  - answer_relevance
  - context_precision
  - context_recall
  - semantic_similarity

dataset_path: ""
output_dir: ./output
batch_size: 10
max_concurrency: 5
